name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Optional stable signing key. Without these secrets the APK is signed with
      # the runner's debug key (fine for testing, but each build's key differs,
      # so you'd have to uninstall before installing the next one).
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Build APK (arm64-v8a, obfuscated, R8 minified)
        run: >
          flutter build apk --release
          --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --tree-shake-icons

      - name: Collect outputs
        id: out
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/upme-${VERSION}-arm64-v8a.apk"
          (cd build/symbols && zip -qr "../../dist/upme-${VERSION}-debug-symbols.zip" .)
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h dist/*.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: upme-${{ steps.out.outputs.version }}
          path: dist/

      - name: Publish pre-release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: UpMe ${{ steps.out.outputs.version }} (early test build)
          prerelease: true
          body_path: .github/release/NOTES.md
          files: dist/*
